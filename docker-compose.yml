version: "2"
services:
  goof:
    build: .
    container_name: goof
    environment:
      - DOCKER=1
    ports:
      - "3001:3001"
      - "9229:9229"
    links:
      - goof-mongo
    depends_on:
      - goof-mongo
    security_opt:
      - no-new-privileges:true
  goof-mongo:
    container_name: goof-mongo
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - goof-mongo-data:/data/db
      - goof-mongo-configdb:/data/configdb
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
  good-mysql:
    container_name: goof-mysql
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: acme
    ports:
      - "127.0.0.1:3306:3306"
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - good-mysql-data:/var/lib/mysql
    tmpfs:
      - /tmp
      - /var/run/mysqld
    cap_drop:
      - ALL

volumes:
  goof-mongo-data:
  goof-mongo-configdb:
  good-mysql-data: