name: Snyk Scans
# SCA, Code and IaC run on PRs and default-branch pushes. 
# The push run is the code scanning baseline and publishes to the Snyk UI.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, master]
permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read          # required by code scanning on private repos
concurrency:
  group: snyk-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sca:
    name: SCA
    # Fork PRs get no secrets, so the scan cannot run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # install-command defaults to "auto". Override with e.g.
      # "dotnet restore", "make deps", or "skip".
      - uses: snyk-demos/snyk-scan-templates/sca@v1
        with:
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          monitor: ${{ github.event_name == 'push' }}
          target-reference: ${{ github.ref_name }}
          project-tags: repo=${{ github.repository }}
          # project-name auto-detects the manifest filename.
  code:
    name: Code
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # --report needs "View Project Ignores" on the token's role, or 403.
      - uses: snyk-demos/snyk-scan-templates/code@v1
        with:
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          monitor: ${{ github.event_name == 'push' }}
          target-reference: ${{ github.ref_name }}
          project-tags: repo=${{ github.repository }}
  iac:
    name: IaC
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: snyk-demos/snyk-scan-templates/iac@v1
        with:
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          monitor: ${{ github.event_name == 'push' }}
          target-reference: ${{ github.ref_name }}
          project-tags: repo=${{ github.repository }}
