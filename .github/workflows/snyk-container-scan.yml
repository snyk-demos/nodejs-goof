name: Snyk Container Scan
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, master]
permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read
concurrency:
  group: snyk-container-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  container:
    name: Container
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_NAME: nodejs-goof:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE_NAME -f Dockerfile .

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk container test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test $IMAGE_NAME \
            --file=Dockerfile \
            --severity-threshold=high \
            --sarif-file-output=snyk-container.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-container.sarif

      - name: Snyk container monitor
        if: github.event_name == 'push'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container monitor $IMAGE_NAME \
            --file=Dockerfile \
            --project-tags=repo=${{ github.repository }} \
            --target-reference=${{ github.ref_name }}
